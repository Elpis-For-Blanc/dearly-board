<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DEARLY BOARD</title><script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script><style>
*{box-sizing:border-box} :root{--pink:#e9a9bf;--deep:#8f5b6e;--ink:#3e353a;--line:#eadde2} body{margin:0;background:#f4f0f2;color:var(--ink);font-family:Arial,'Noto Sans KR',sans-serif}.app{display:grid;grid-template-columns:350px 1fr;min-height:100vh}.panel{background:#fff;border-right:1px solid #ddd;padding:22px;overflow:auto;height:100vh;position:sticky;top:0}.brand{font:26px Georgia,serif;letter-spacing:4px}.tag{font-size:12px;color:#98858d;margin:5px 0 20px}.sec{border-top:1px solid #eee;padding:15px 0}.sec h3{font-size:11px;letter-spacing:1.6px;margin:0 0 10px;color:#755f68}.row{display:flex;gap:7px;flex-wrap:wrap}.field{width:100%;border:1px solid #ded5d9;border-radius:8px;padding:9px;background:#fff;margin:4px 0}button{border:1px solid #d9ccd1;background:#fff;border-radius:8px;padding:9px 11px;cursor:pointer}button:hover{background:#fff6f9}.primary{background:#edb6c9;border-color:#edb6c9}.workspace{padding:30px;overflow:auto;display:flex;justify-content:center;align-items:flex-start}.board{width:900px;height:900px;position:relative;overflow:hidden;background:#fff8fb;border:12px solid #efb8cb;box-shadow:0 12px 40px #38242d22}.board::after{content:"";position:absolute;inset:10px;border:1px solid var(--board-inner,#d9d9d9);pointer-events:none;z-index:9999}.item{position:absolute;left:80px;top:80px;min-width:50px;min-height:35px;touch-action:none;user-select:none;transform-origin:center}.item.selected{outline:1.5px dashed #755f68;outline-offset:5px}.handle{display:none;position:absolute;width:13px;height:13px;right:-10px;bottom:-10px;background:#fff;border:1px solid #6d5962;border-radius:50%;cursor:nwse-resize}.selected .handle{display:block}.item img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}.photo{width:230px;height:230px;background:#fff;padding:9px;box-shadow:0 5px 16px #0002}.photo.polaroid{height:275px;padding:10px 10px 42px}.photo.rounded{border-radius:20px;overflow:hidden}.photo.circle{border-radius:50%;overflow:hidden;padding:0}.photo.film{background:#161616;padding:18px 8px}.sticker{width:130px;height:130px}.textitem{width:270px;padding:10px 12px;white-space:pre-wrap;line-height:1.55;overflow-wrap:anywhere}.textitem.label{background:#fff;border:1px solid #ead8df}.textitem.note{background:#fff0a9;box-shadow:3px 5px 12px #0002;padding:18px}.textitem.ribbon{background:#efb6ca;text-align:center;border-radius:4px}.decor{display:flex;align-items:center;justify-content:center;font-size:42px;width:80px;height:80px}.theme-princess{background:#fff8fb;border-color:#efb8cb;--board-inner:#e7a9bf}.theme-princess::before{content:"♡  ·  ✦  ·  ♡";position:absolute;left:50%;top:18px;transform:translateX(-50%);font:14px Georgia;color:#d58ca6;letter-spacing:5px}.theme-cork{background-color:#c99a6b;border-color:#9a704d;--board-inner:#7d573b;background-image:radial-gradient(#8d6847 .7px,transparent .8px);background-size:7px 7px}.theme-minimal{background:#f7f7f7;border-color:#292929;--board-inner:#777}.theme-dark{background:#17161a;border-color:#4c4650;--board-inner:#716b75}.theme-y2k{background:linear-gradient(135deg,#e8f7ff,#f8eaff,#fff4fb);border-color:#bfc5dc;--board-inner:#aeb9d8}.theme-vintage{background:#e9dfc8;border-color:#806b55;--board-inner:#9a8267;background-image:linear-gradient(#ffffff20,#00000008)}.theme-cloud{background:linear-gradient(#dff2ff,#fff);border-color:#a9d1e8;--board-inner:#8fc3df}.theme-night{background:radial-gradient(circle at 30% 20%,#36395b,#171827 60%);border-color:#777aa5;--board-inner:#62668e}.hidden-export .selected{outline:none}.hidden-export .handle{display:none!important}@media(max-width:900px){.app{grid-template-columns:1fr}.panel{position:relative;height:auto;border-right:0}.workspace{padding:12px}.board{transform:scale(.72);transform-origin:top center;margin-bottom:-250px}}

/* V2.2 refined decor + board styles */
.decor{font-family:Georgia,"Times New Roman",serif}
.decor-svg{width:120px;height:90px;color:#6f6267}
.decor-svg svg{width:100%;height:100%;display:block;overflow:visible}
.theme-letter{background:#fbf7ef;border-color:#c9b59b;--board-inner:#d8c8b3;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 35px,#b9c7d233 36px)}
.theme-scrapbook{background:#eee7dc;border-color:#9f8a72;--board-inner:#b9a58e;background-image:linear-gradient(90deg,#00000008 1px,transparent 1px),linear-gradient(#00000008 1px,transparent 1px);background-size:24px 24px}
.theme-rose{background:linear-gradient(145deg,#fffafb,#f8e8ee);border-color:#b7778e;--board-inner:#d8a0b3}
.theme-sky{background:linear-gradient(180deg,#eaf7ff,#fdfcff 65%);border-color:#b5d5e8;--board-inner:#9fc7df}
.theme-matcha{background:#f2f1e5;border-color:#889476;--board-inner:#aeb79d}
.theme-cherry{background:#fff7f7;border-color:#b94755;--board-inner:#df9aa2}
.theme-lilac{background:linear-gradient(135deg,#f7f1ff,#fffaff);border-color:#a78ebd;--board-inner:#c7b5d7}
.theme-metal{background:linear-gradient(135deg,#f2f3f5,#d8dce1);border-color:#777d86;--board-inner:#a3a8af}

[data-size].active{background:#2f292d;color:#fff;border-color:#2f292d}
.board{max-width:none!important;max-height:none!important;flex:none!important}
</style></head><body><div class="app"><aside class="panel"><div class="brand">DEARLY BOARD</div><div class="tag">좋아하는 것들로 채우는 우리만의 보드.</div>
<div class="sec"><h3>BOARD STYLE</h3><select id="theme" class="field"><option value="princess">PRINCESS PINK</option><option value="cork">CORK BOARD</option><option value="minimal">MINIMAL</option><option value="dark">DARK</option><option value="y2k">Y2K</option><option value="vintage">VINTAGE</option><option value="cloud">CLOUD</option><option value="night">MIDNIGHT</option><option value="letter">LETTER PAPER</option><option value="scrapbook">SCRAPBOOK</option><option value="rose">DUSTY ROSE</option><option value="sky">POWDER SKY</option><option value="matcha">MATCHA CREAM</option><option value="cherry">CHERRY RED</option><option value="lilac">LILAC DREAM</option><option value="metal">SILVER METAL</option></select><div class="row"><button data-size="1:1">1:1</button><button data-size="4:5">4:5</button><button data-size="3:4">3:4</button><button data-size="16:9">16:9</button></div><label>배경색 <input id="bg" type="color" value="#fff8fb"></label><button id="wallBtn">배경 이미지 +</button><input id="wallInput" type="file" accept="image/*" hidden><button id="wallClear">배경 이미지 제거</button></div>
<div class="sec"><h3>ADD ITEMS</h3><div class="row"><button id="photoBtn">사진 +</button><button id="stickerBtn">PNG 스티커 +</button><button id="textBtn">텍스트 +</button></div><input id="photoInput" type="file" accept="image/*" multiple hidden><input id="stickerInput" type="file" accept="image/png,image/webp" multiple hidden><textarea id="text" class="field" rows="4" placeholder="보드에 넣을 문구를 입력해 주세요."></textarea><select id="textStyle" class="field"><option value="plain">텍스트만</option><option value="label">화이트 라벨</option><option value="note">포스트잇</option><option value="ribbon">리본 라벨</option></select><select id="font" class="field"><option value="Arial">기본 고딕</option><option value="Georgia">클래식 세리프</option><option value="serif">명조 계열</option><option value="monospace">타자기</option><option value="cursive">손글씨 계열</option></select><div class="row"><label>글자색 <input id="textColor" type="color" value="#4b3c43"></label><label>크기 <input id="fontSize" type="number" value="18" min="8" max="80" style="width:65px"></label></div></div>
<div class="sec"><h3>PHOTO FRAME</h3><select id="photoFrame" class="field"><option value="basic">기본</option><option value="polaroid">폴라로이드</option><option value="rounded">둥근 프레임</option><option value="circle">원형</option><option value="film">필름</option></select></div>
<div class="sec"><h3>QUICK DECOR</h3><div class="row">
<button data-decor="♡">♡</button><button data-decor="✦">✦</button><button data-decor="☆">☆</button><button data-decor="୨୧">୨୧</button>
<button data-svg="ribbon">라인 리본</button><button data-svg="clip">페이퍼 클립</button><button data-svg="tape">빈티지 테이프</button><button data-svg="pin">미니 핀</button>
<button data-svg="flower">라인 플라워</button><button data-svg="pearl">펄 체인</button><button data-svg="stamp">포스트 스탬프</button><button data-svg="lace">레이스 보더</button>
<button data-svg="ticket">티켓</button><button data-svg="label">라벨</button><button data-svg="sparkle">라인 스파클</button>
</div></div>
<div class="sec"><h3>SELECTED ITEM</h3><div class="row"><button id="front">맨 앞으로</button><button id="back">맨 뒤로</button><button id="dup">복제</button><button id="flip">좌우반전</button><button id="del">삭제</button></div><label>회전 <input id="rot" class="field" type="range" min="-180" max="180" value="0"></label><label>투명도 <input id="opacity" class="field" type="range" min="10" max="100" value="100"></label></div>
<div class="sec"><h3>HISTORY</h3><div class="row"><button id="undo">실행취소</button><button id="redo">다시실행</button><button id="clear">전체 비우기</button></div></div>
<div class="sec"><h3>EXPORT</h3><button class="primary" id="save">고화질 PNG 저장</button></div></aside><main class="workspace"><div id="board" class="board theme-princess"></div></main></div>
<script>
const $=s=>document.querySelector(s),board=$('#board'),rot=$('#rot'),opacity=$('#opacity');let selected=null,z=10,history=[],future=[],restoring=false;
function snap(){if(restoring)return;history.push(board.innerHTML);if(history.length>40)history.shift();future=[]}snap();
function restore(html){restoring=true;board.innerHTML=html;wireAll();selected=null;restoring=false}
function select(el){document.querySelectorAll('.item').forEach(x=>x.classList.remove('selected'));selected=el;if(el){el.classList.add('selected');rot.value=el.dataset.rot||0;opacity.value=(el.dataset.opacity||1)*100}}
board.addEventListener('pointerdown',e=>{if(e.target===board)select(null)});
function transform(el){let flip=el.dataset.flip==='1'?-1:1;el.style.transform=`rotate(${el.dataset.rot||0}deg) scaleX(${flip})`;el.style.opacity=el.dataset.opacity||1}
function makeItem(el,type){el.classList.add('item',type);el.style.zIndex=++z;el.dataset.rot=0;el.dataset.opacity=1;let h=document.createElement('span');h.className='handle';el.appendChild(h);board.appendChild(el);wire(el);select(el);snap()}
function wire(el){let h=el.querySelector('.handle');el.onpointerdown=e=>{if(e.target===h)return;select(el);let sx=e.clientX,sy=e.clientY,l=el.offsetLeft,t=el.offsetTop;el.setPointerCapture(e.pointerId);let moved=false;el.onpointermove=ev=>{moved=true;el.style.left=l+(ev.clientX-sx)+'px';el.style.top=t+(ev.clientY-sy)+'px'};el.onpointerup=()=>{el.onpointermove=null;el.onpointerup=null;if(moved)snap()}};if(h)h.onpointerdown=e=>{e.stopPropagation();let sx=e.clientX,sy=e.clientY,w=el.offsetWidth,hh=el.offsetHeight;h.setPointerCapture(e.pointerId);h.onpointermove=ev=>{el.style.width=Math.max(40,w+ev.clientX-sx)+'px';el.style.height=Math.max(35,hh+ev.clientY-sy)+'px'};h.onpointerup=()=>{h.onpointermove=null;h.onpointerup=null;snap()}}}
function wireAll(){document.querySelectorAll('.item').forEach(wire)}
function files(input,type){input.onchange=()=>{[...input.files].forEach(f=>{let r=new FileReader;r.onload=()=>{let d=document.createElement('div'),im=document.createElement('img');im.src=r.result;d.appendChild(im);if(type==='photo'){let fr=$('#photoFrame').value;if(fr!=='basic')d.classList.add(fr)}makeItem(d,type)};r.readAsDataURL(f)});input.value=''}}files($('#photoInput'),'photo');files($('#stickerInput'),'sticker');
$('#photoBtn').onclick=()=>$('#photoInput').click();$('#stickerBtn').onclick=()=>$('#stickerInput').click();$('#textBtn').onclick=()=>{if(!$('#text').value.trim())return;let d=document.createElement('div');d.textContent=$('#text').value;let st=$('#textStyle').value;if(st!=='plain')d.classList.add(st);d.style.fontFamily=$('#font').value;d.style.color=$('#textColor').value;d.style.fontSize=$('#fontSize').value+'px';makeItem(d,'textitem');$('#text').value=''};
document.querySelectorAll('[data-decor]').forEach(b=>b.onclick=()=>{let d=document.createElement('div');d.textContent=b.dataset.decor;makeItem(d,'decor')});
const svgDecor={
 ribbon:`<svg viewBox="0 0 160 82"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M79 39C61 22 41 18 29 25c-9 5-7 17 2 21 13 6 31-1 48-7Z"/><path d="M81 39c18-17 38-21 50-14 9 5 7 17-2 21-13 6-31-1-48-7Z"/><path d="M72 38c0-7 4-11 8-11s8 4 8 11-4 11-8 11-8-4-8-11Z"/><path d="M75 48 57 72l22-10M85 48l18 24-22-10"/></g></svg>`,
 clip:`<svg viewBox="0 0 80 126"><path d="M51 17c17 0 22 18 12 31L31 91c-8 11-25 1-17-11l31-42c5-7 15 0 10 7L27 83" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
 tape:`<svg viewBox="0 0 170 64"><path d="M12 15 157 8l3 42-145 7Z" fill="#eadfce" fill-opacity=".72"/><path d="m12 15 9 5-7 7 8 6-7 7 8 6-8 11M157 8l-8 7 9 6-8 7 9 6-8 7 9 9" fill="none" stroke="#b9aa95" stroke-width="1.2" opacity=".65"/></svg>`,
 pin:`<svg viewBox="0 0 90 100"><g fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="45" cy="31" r="15"/><path d="M34 43h22M45 46v43"/></g><circle cx="40" cy="26" r="3" fill="currentColor" opacity=".18"/></svg>`,
 flower:`<svg viewBox="0 0 110 110"><g fill="none" stroke="currentColor" stroke-width="1.8"><path d="M55 53C37 47 31 29 41 22c10-7 18 8 14 31ZM57 53c4-18 20-28 29-20 9 8-2 20-29 20ZM56 56c18 4 28 20 20 29-8 9-20-2-20-29ZM53 56c-4 18-20 28-29 20-9-8 2-20 29-20Z"/><circle cx="55" cy="55" r="6"/></g></svg>`,
 pearl:`<svg viewBox="0 0 180 62"><path d="M8 15c42 37 121 38 164 0" fill="none" stroke="#aaa3a0" stroke-width="1.2"/><g fill="#fffdf9" stroke="#aaa3a0" stroke-width="1"><circle cx="24" cy="27" r="4.5"/><circle cx="46" cy="39" r="4.5"/><circle cx="70" cy="47" r="4.5"/><circle cx="94" cy="49" r="4.5"/><circle cx="118" cy="45" r="4.5"/><circle cx="142" cy="35" r="4.5"/><circle cx="162" cy="23" r="4.5"/></g></svg>`,
 stamp:`<svg viewBox="0 0 120 142"><path d="M10 8h100v126H10Z" fill="#fffdf8" stroke="currentColor" stroke-width="1.8" stroke-dasharray="3 4"/><path d="M21 20h78v102H21Z" fill="none" stroke="currentColor" stroke-width="1" opacity=".45"/><text x="60" y="67" text-anchor="middle" font-family="Georgia" font-size="12" letter-spacing="2" fill="currentColor">DEARLY</text><path d="M47 81h26M53 88h14" stroke="currentColor" stroke-width="1" opacity=".6"/></svg>`,
 lace:`<svg viewBox="0 0 190 55"><path d="M5 15h180M5 24h180" stroke="currentColor" stroke-width="1.3"/><path d="M6 24q9 18 18 0 9 18 18 0 9 18 18 0 9 18 18 0 9 18 18 0 9 18 18 0 9 18 18 0 9 18 18 0 9 18 18 0 9 18 18 0" fill="none" stroke="currentColor" stroke-width="1.3"/><g fill="currentColor"><circle cx="15" cy="31" r="1.5"/><circle cx="51" cy="31" r="1.5"/><circle cx="87" cy="31" r="1.5"/><circle cx="123" cy="31" r="1.5"/><circle cx="159" cy="31" r="1.5"/></g></svg>`,
 ticket:`<svg viewBox="0 0 170 86"><path d="M12 12h146v18c-10 0-10 26 0 26v18H12V56c10 0 10-26 0-26Z" fill="#fffaf4" stroke="currentColor" stroke-width="1.5"/><path d="M48 17v52" stroke="currentColor" stroke-width="1" stroke-dasharray="3 4" opacity=".55"/><text x="101" y="39" text-anchor="middle" font-family="Georgia" font-size="12" letter-spacing="2" fill="currentColor">DEARLY</text><text x="101" y="56" text-anchor="middle" font-family="Georgia" font-size="8" letter-spacing="1" fill="currentColor">KEEP THIS MOMENT</text></svg>`,
 label:`<svg viewBox="0 0 180 70"><path d="M11 13h158v44H11Z" fill="#fffdf9" stroke="currentColor" stroke-width="1.4"/><path d="M18 20h144v30H18Z" fill="none" stroke="currentColor" stroke-width=".8" opacity=".45"/><circle cx="26" cy="35" r="2" fill="currentColor"/><circle cx="154" cy="35" r="2" fill="currentColor"/><text x="90" y="39" text-anchor="middle" font-family="Georgia" font-size="11" letter-spacing="2" fill="currentColor">OUR STORY</text></svg>`,
 sparkle:`<svg viewBox="0 0 100 100"><g fill="none" stroke="currentColor" stroke-width="1.8"><path d="M50 10c2 23 10 31 33 33-23 2-31 10-33 33-2-23-10-31-33-33 23-2 31-10 33-33Z"/><path d="M78 64c1 9 4 12 13 13-9 1-12 4-13 13-1-9-4-12-13-13 9-1 12-4 13-13Z"/></g></svg>`
};
document.querySelectorAll('[data-svg]').forEach(b=>b.onclick=()=>{let d=document.createElement('div');d.className='decor-svg';d.innerHTML=svgDecor[b.dataset.svg];makeItem(d,'decor')});

$('#theme').onchange=()=>{board.className='board theme-'+$('#theme').value;snap()};$('#bg').oninput=()=>board.style.backgroundColor=$('#bg').value;
document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{
      const w=Number(b.dataset.w), h=Number(b.dataset.h);
      board.style.setProperty('width',w+'px','important');
      board.style.setProperty('height',h+'px','important');
      board.style.setProperty('aspect-ratio',w+' / '+h,'important');
      board.dataset.exportWidth=w; board.dataset.exportHeight=h;
      document.querySelectorAll('[data-size]').forEach(x=>x.classList.toggle('active',x===b));
    });
$('#wallBtn').onclick=()=>$('#wallInput').click();$('#wallInput').onchange=()=>{let f=$('#wallInput').files[0];if(!f)return;let r=new FileReader;r.onload=()=>{board.style.backgroundImage=`url(${r.result})`;board.style.backgroundSize='cover';board.style.backgroundPosition='center';snap()};r.readAsDataURL(f)};$('#wallClear').onclick=()=>{board.style.backgroundImage='';snap()};
function apply(){if(!selected)return;selected.dataset.rot=rot.value;selected.dataset.opacity=opacity.value/100;transform(selected)}rot.oninput=apply;opacity.oninput=apply;rot.onchange=snap;opacity.onchange=snap;
$('#front').onclick=()=>{if(selected){selected.style.zIndex=++z;snap()}};$('#back').onclick=()=>{if(selected){selected.style.zIndex=1;snap()}};$('#del').onclick=()=>{if(selected){selected.remove();selected=null;snap()}};$('#flip').onclick=()=>{if(selected){selected.dataset.flip=selected.dataset.flip==='1'?'0':'1';transform(selected);snap()}};$('#dup').onclick=()=>{if(!selected)return;let c=selected.cloneNode(true);c.classList.remove('selected');c.style.left=selected.offsetLeft+25+'px';c.style.top=selected.offsetTop+25+'px';board.appendChild(c);wire(c);select(c);snap()};
$('#undo').onclick=()=>{if(history.length<=1)return;future.push(history.pop());restore(history[history.length-1])};$('#redo').onclick=()=>{if(!future.length)return;let h=future.pop();history.push(h);restore(h)};$('#clear').onclick=()=>{if(confirm('보드의 모든 요소를 비우시겠습니까?')){board.querySelectorAll('.item').forEach(x=>x.remove());select(null);snap()}};
$('#save').onclick=async()=>{select(null);board.classList.add('hidden-export');try{let c=await html2canvas(board,{scale:3,useCORS:true,allowTaint:false,backgroundColor:null,logging:false});let a=document.createElement('a');a.download='DEARLY_BOARD.png';a.href=c.toDataURL('image/png');a.click()}catch(e){alert('PNG 저장 중 문제가 발생했습니다.')}finally{board.classList.remove('hidden-export')}};
</script></body></html>
