<script>
const $=s=>document.querySelector(s),board=$('#board'),rot=$('#rot'),opacity=$('#opacity');let selected=null,z=10,history=[],future=[],restoring=false;
function snap(){if(restoring)return;history.push(board.innerHTML);if(history.length>40)history.shift();future=[]}snap();
function restore(html){restoring=true;board.innerHTML=html;wireAll();selected=null;restoring=false}
function select(el){document.querySelectorAll('.item').forEach(x=>x.classList.remove('selected'));selected=el;if(el){el.classList.add('selected');rot.value=el.dataset.rot||0;opacity.value=(el.dataset.opacity||1)*100}}
board.addEventListener('pointerdown',e=>{if(e.target===board)select(null)});
function transform(el){let flip=el.dataset.flip==='1'?-1:1;el.style.transform=`rotate(${el.dataset.rot||0}deg) scaleX(${flip})`;el.style.opacity=el.dataset.opacity||1}

function getLayerItems(){
  return [...board.querySelectorAll('.item')];
}
function normalizeLayers(){
  const items=getLayerItems();
  const domIndex=new Map(items.map((el,i)=>[el,i]));
  items.sort((a,b)=>{
    const za=parseInt(getComputedStyle(a).zIndex,10);
    const zb=parseInt(getComputedStyle(b).zIndex,10);
    const va=Number.isFinite(za)?za:0;
    const vb=Number.isFinite(zb)?zb:0;
    return va-vb || domIndex.get(a)-domIndex.get(b);
  });
  items.forEach((el,i)=>el.style.zIndex=String(10+i));
  z=10+items.length;
}
function moveLayer(el,toFront){
  if(!el)return;
  normalizeLayers();
  const items=getLayerItems();
  if(toFront){
    const max=Math.max(...items.map(x=>parseInt(x.style.zIndex||'0',10)));
    el.style.zIndex=String(max+1);
    board.appendChild(el);
  }else{
    const min=Math.min(...items.map(x=>parseInt(x.style.zIndex||'0',10)));
    el.style.zIndex=String(min-1);
    board.insertBefore(el,board.firstChild);
  }
  normalizeLayers();
}

function makeItem(el,type){
el.classList.add('item',type);
el.style.zIndex=++z;
el.dataset.rot=0;
el.dataset.opacity=1;
let h=document.createElement('span');
h.className='handle';
el.appendChild(h);
if(type==='photo'||type==='sticker'||type==='textitem'){
  let rh=document.createElement('span');
  rh.className='rotate-handle';
  rh.title='드래그해서 회전';
  rh.innerHTML='↻';
  el.appendChild(rh);
  if(el.classList.contains('textitem')){
    const f=$('#font'),fs=$('#fontSize'),tc=$('#textColor');
    if(f && el.style.fontFamily){
      const target=el.style.fontFamily.replace(/"/g,"'");
      [...f.options].forEach(o=>{
        if(o.value.replace(/"/g,"'")===target)f.value=o.value;
      });
      updateFontPreview();
    }
    if(fs && el.style.fontSize)fs.value=parseInt(el.style.fontSize)||18;
    if(tc && el.style.color){
      const c=el.style.color;
      if(c.startsWith('#'))tc.value=c;
    }
  }
}

board.appendChild(el);
wire(el);
select(el);
snap()
}
function wire(el){
let h=el.querySelector('.handle');
let rh=el.querySelector('.rotate-handle');

el.onpointerdown=e=>{
  if(e.target===h||e.target===rh)return;
  select(el);
  let sx=e.clientX,sy=e.clientY,l=el.offsetLeft,t=el.offsetTop;
  el.setPointerCapture(e.pointerId);
  let moved=false;
  el.onpointermove=ev=>{
    moved=true;
    el.style.left=l+(ev.clientX-sx)+'px';
    el.style.top=t+(ev.clientY-sy)+'px'
  };
  el.onpointerup=()=>{
    el.onpointermove=null;
    el.onpointerup=null;
    if(moved)snap()
  }
};

if(h)h.onpointerdown=e=>{
  e.stopPropagation();
  select(el);
  let sx=e.clientX,sy=e.clientY,w=el.offsetWidth,hh=el.offsetHeight;
  h.setPointerCapture(e.pointerId);
  h.onpointermove=ev=>{
    el.style.width=Math.max(40,w+ev.clientX-sx)+'px';
    el.style.height=Math.max(35,hh+ev.clientY-sy)+'px'
  };
  h.onpointerup=()=>{
    h.onpointermove=null;
    h.onpointerup=null;
    snap()
  }
};

if(rh)rh.onpointerdown=e=>{
  e.stopPropagation();
  select(el);
  const rect=el.getBoundingClientRect();
  const cx=rect.left+rect.width/2;
  const cy=rect.top+rect.height/2;
  const startPointer=Math.atan2(e.clientY-cy,e.clientX-cx)*180/Math.PI;
  const startRot=Number(el.dataset.rot||0);

  rh.setPointerCapture(e.pointerId);
  rh.onpointermove=ev=>{
    const now=Math.atan2(ev.clientY-cy,ev.clientX-cx)*180/Math.PI;
    let next=Math.round(startRot+(now-startPointer));
    while(next>180)next-=360;
    while(next<-180)next+=360;
    el.dataset.rot=next;
    rot.value=next;
    transform(el);
  };
  rh.onpointerup=()=>{
    rh.onpointermove=null;
    rh.onpointerup=null;
    snap()
  }
}
}

function apply(){if(!selected)return;selected.dataset.rot=rot.value;selected.dataset.opacity=opacity.value/100;transform(selected)}rot.oninput=apply;opacity.oninput=apply;rot.onchange=snap;opacity.onchange=snap;
$('#front').onclick=()=>{if(selected){moveLayer(selected,true);snap()}};$('#back').onclick=()=>{if(selected){moveLayer(selected,false);snap()}};$('#del').onclick=()=>{if(selected){selected.remove();selected=null;snap()}};$('#flip').onclick=()=>{if(selected){selected.dataset.flip=selected.dataset.flip==='1'?'0':'1';transform(selected);snap()}};$('#dup').onclick=()=>{if(!selected)return;let c=selected.cloneNode(true);c.classList.remove('selected');c.style.left=selected.offsetLeft+25+'px';c.style.top=selected.offsetTop+25+'px';board.appendChild(c);wire(c);select(c);snap()};
$('#undo').onclick=()=>{if(history.length<=1)return;future.push(history.pop());restore(history[history.length-1])};$('#redo').onclick=()=>{if(!future.length)return;let h=future.pop();history.push(h);restore(h)};$('#clear').onclick=()=>{if(confirm('보드의 모든 요소를 비우시겠습니까?')){board.querySelectorAll('.item').forEach(x=>x.remove());select(null);snap()}};

function serializeProject(){
  normalizeLayers();
  const hadSelected=selected;
  if(hadSelected)hadSelected.classList.remove('selected');

  const data={
    app:'DEARLY BOARD',
    version:PROJECT_VERSION,
    savedAt:new Date().toISOString(),
    board:{
      html:board.innerHTML,
      className:board.className,
      style:board.getAttribute('style')||'',
      width:Number(board.dataset.exportWidth)||board.offsetWidth,

function downloadProject(){
  try{
    select(null);

    const a=document.createElement('a');

    const stamp=`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}-${String(d.getHours()).padStart(2,'0')}${String(d.getMinutes()).padStart(2,'0')}`;

    console.error(e);

}

function setSelectValue(el,value){
  if(!el||value==null)return;
  const v=String(value);
  if([...el.options].some(o=>o.value===v))el.value=v;

function loadProjectData(data){
  if(!data||data.app!=='DEARLY BOARD'||!data.board){
    throw new Error('DEARLY BOARD 작업 파일이 아닙니다.');
  }

  select(null);
  restoring=true;

  board.innerHTML=data.board.html||'';
  board.className=data.board.className||'board theme-princess';
  board.removeAttribute('style');
  if(data.board.style)board.setAttribute('style',data.board.style);

  const w=Number(data.board.width)||900;
  const h=Number(data.board.height)||900;
  board.style.width=w+'px';
  board.style.height=h+'px';
  board.dataset.exportWidth=String(w);
  board.dataset.exportHeight=String(h);

  const ui=data.ui||{};
  setSelectValue($('#theme'),ui.theme);
  if($('#bg')&&ui.bg)$('#bg').value=ui.bg;
  setSelectValue($('#photoFrame'),ui.photoFrame);
  setSelectValue($('#textStyle'),ui.textStyle);
  setSelectValue($('#font'),ui.font);
  if($('#textColor')&&ui.textColor)$('#textColor').value=ui.textColor;
  if($('#fontSize')&&ui.fontSize)$('#fontSize').value=ui.fontSize;
  if($('#oocNpcToken')&&ui.npcToken!=null)$('#oocNpcToken').value=ui.npcToken;
  if($('#oocPcToken')&&ui.pcToken!=null)$('#oocPcToken').value=ui.pcToken;

  const ratio=data.board.ratio||'1:1';
  document.querySelectorAll('[data-size]').forEach(btn=>{
    btn.classList.toggle('active',btn.dataset.size===ratio);
  });

  wireAll();

  let maxZ=10;
  board.querySelectorAll('.item').forEach(item=>{
    const zi=parseInt(item.style.zIndex||'0',10);
    if(Number.isFinite(zi))maxZ=Math.max(maxZ,zi);
    transform(item);
  });
  z=maxZ;

  restoring=false;
  selected=null;
  history=[board.innerHTML];
  future=[];

  if(typeof updateFontPreview==='function')updateFontPreview();
  projectStatus('작업을 불러왔어요 ✓');
}

async function waitForBoardAssets(root){
  if(document.fonts && document.fonts.ready){
    try{await document.fonts.ready}catch(e){}
  }

  const imgs=[...root.querySelectorAll('img')];
  await Promise.all(imgs.map(async img=>{
    if(!img.complete){
      await new Promise(resolve=>{
        img.addEventListener('load',resolve,{once:true});
        img.addEventListener('error',resolve,{once:true});
      });
    }
    if(img.decode){
      try{await img.decode()}catch(e){}
    }
  }));

  await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
}

function lockPreviewLayerOrder(){
  normalizeLayers();

  // Physically reorder DOM from back -> front as a second guarantee.
  const items=[...board.querySelectorAll('.item')];
  items.sort((a,b)=>{
    const za=parseInt(getComputedStyle(a).zIndex,10)||0;
    const zb=parseInt(getComputedStyle(b).zIndex,10)||0;
    return za-zb;
  });
  items.forEach(el=>board.appendChild(el));

  // Re-number once more after DOM reorder.
  items.forEach((el,i)=>el.style.zIndex=String(10+i));
  z=10+items.length;
}

async function exportBoardPng(){
  select(null);
  lockPreviewLayerOrder();
  await waitForBoardAssets(board);

  const exportW=Number(board.dataset.exportWidth)||board.offsetWidth;
  const exportH=Number(board.dataset.exportHeight)||board.offsetHeight;

  /*
    IMPORTANT:
    Do not rebuild item geometry during export.
    The live preview already contains the exact positions, sizes, rotations,
    opacity and stacking order that the user sees. html2canvas clones those
    inline styles itself. We only neutralize responsive board scaling and
    hide editing controls in the cloned document.
  */
  const sourceCanvas=await html2canvas(board,{
    scale:1,
    useCORS:true,
    allowTaint:false,
    backgroundColor:null,
    logging:false,
    width:exportW,
    height:exportH,
    scrollX:0,
    scrollY:0,
    windowWidth:Math.max(window.innerWidth,exportW+100),
    windowHeight:Math.max(window.innerHeight,exportH+100),
    onclone:(doc)=>{
      const cloned=doc.getElementById('board');
      if(!cloned)return;

      cloned.classList.add('hidden-export');
      cloned.style.setProperty('width',exportW+'px','important');
      cloned.style.setProperty('height',exportH+'px','important');
      cloned.style.setProperty('max-width','none','important');
      cloned.style.setProperty('max-height','none','important');
      cloned.style.setProperty('transform','none','important');
      cloned.style.setProperty('transform-origin','top left','important');
      cloned.style.setProperty('margin','0','important');
      cloned.style.setProperty('flex','none','important');

      cloned.querySelectorAll('.selected').forEach(x=>x.classList.remove('selected'));
      cloned.querySelectorAll('.handle,.rotate-handle').forEach(x=>x.remove());

      // Keep the exact live-preview layer order in the clone.
      const liveItems=[...board.querySelectorAll('.item')];
      const cloneItems=[...cloned.querySelectorAll('.item')];

      liveItems.forEach((live,i)=>{
        const copy=cloneItems[i];
        if(!copy)return;

        // Copy only the live inline item state, without recalculating dimensions.
        copy.setAttribute('style',live.getAttribute('style')||'');
        copy.dataset.rot=live.dataset.rot||0;
        copy.dataset.flip=live.dataset.flip||0;
        copy.dataset.opacity=live.dataset.opacity||1;

        // Re-apply transform from saved item state.
        const flip=copy.dataset.flip==='1'?-1:1;
        copy.style.transform=`rotate(${copy.dataset.rot||0}deg) scaleX(${flip})`;
        copy.style.opacity=copy.dataset.opacity||1;
        copy.style.transformOrigin='center center';
      });
    }
  });

  // Upscale the already-captured preview bitmap.
  // This cannot change element size/order because layout is finished beforehand.
  const outputScale=3;
  const finalCanvas=document.createElement('canvas');
  finalCanvas.width=sourceCanvas.width*outputScale;
  finalCanvas.height=sourceCanvas.height*outputScale;

  const ctx=finalCanvas.getContext('2d');
  ctx.imageSmoothingEnabled=true;
  ctx.imageSmoothingQuality='high';
  ctx.drawImage(
    sourceCanvas,
    0,0,sourceCanvas.width,sourceCanvas.height,
    0,0,finalCanvas.width,finalCanvas.height
  );

  const blob=await new Promise((resolve,reject)=>{
    finalCanvas.toBlob(
      b=>b?resolve(b):reject(new Error('PNG 생성 실패')),
      'image/png'
    );
  });

  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.download='DEARLY_BOARD.png';
  a.href=url;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

$('#save').onclick=async()=>{
  try{
    await exportBoardPng();
  }catch(e){
    console.error(e);
    alert('PNG 저장 중 문제가 발생했습니다.');
  }
};

<script id="dearly-board-ai-ooc-script">
(function(){
  const $id=(id)=>document.getElementById(id);

  function currentThemeLabel(){
    const s=$id("theme");
    return s && s.selectedOptions && s.selectedOptions[0]
      ? s.selectedOptions[0].textContent.trim()
      : "현재 선택한 스타일";
  }

  function currentRatio(){
    const active=document.querySelector("[data-size].active");
    return active ? (active.dataset.size || active.textContent.trim()) : "현재 보드 비율";
  }

  function tokens(){
    return {
      npc:($id("oocNpcToken")?.value || "{{char}}").trim() || "{{char}}",
      pc:($id("oocPcToken")?.value || "{{user}}").trim() || "{{user}}"
    };
  }

  function commonGuide(theme,ratio){
    return `현재 DEARLY BOARD의 선택 스타일은 '${theme}', 비율은 '${ratio}'입니다. ` +
      `스타일은 참고하되 인물의 실제 취향·성격과 충돌하면 인물성을 우선하세요. ` +
      `제작기에 옮겨 적기 위한 항목 목록이나 템플릿처럼 답하지 말고, 완성된 보드 한 장을 눈앞에서 바라보는 것처럼 상세하게 서술해 주세요. ` +
      `전체적인 구도와 시선의 흐름부터 설명하고, 어느 영역에 어떤 사진·메모·티켓·영수증·기념물·스티커·낙서가 놓였는지 위치와 크기, 겹침, 기울기, 여백, 색 조합, 재질감, 테이프나 클립 같은 고정 방식까지 구체적으로 묘사해 주세요. ` +
      `각 메모나 짧은 문구는 실제로 그 사람이 적었을 법한 말투로 자연스럽게 포함하고, 사진이나 기념물은 어떤 장면·기억을 담고 있는지도 설명해 주세요. ` +
      `요소 하나하나를 독립된 리스트로 나열하기보다, 왼쪽 위에서 오른쪽 아래로 보드를 훑듯이 연결된 문단으로 서술해 주세요. ` +
      `확인된 대화·설정·취향·관계 변화를 우선하고, 확인되지 않은 사건이나 취향은 사실처럼 단정하지 말고 꼭 필요할 때만 성격과 관계성에 맞게 가볍게 추론하세요.`;
  }

  function buildOoc(mode){
    const {npc,pc}=tokens();
    const theme=currentThemeLabel();
    const ratio=currentRatio();
    const guide=commonGuide(theme,ratio);

    if(mode==="npc"){
      return `[OOC: 롤플레잉 중단. 새로운 에피소드 시작. 보드 제작자 = NPC(${npc}). 지금까지의 전체 대화, 캐릭터 설정, 세계관과 관계 변화를 바탕으로 ${npc}가 혼자 실제로 메모하고 꾸며 온 개인 보드가 완성되어 있다고 가정하고, 그 완성본의 배치와 디자인을 상세하게 묘사해 주세요. ${pc}가 대신 만든 보드처럼 쓰지 말고, ${npc}가 자기 손으로 조금씩 붙이고 적어 온 흔적과 취향이 드러나야 합니다. ${pc}와 관련된 기억이 들어가도 좋지만 모든 요소를 연애 중심으로 만들 필요는 없습니다. ${guide}]`;
    }

    if(mode==="pc"){
      return `[OOC: 롤플레잉 중단. 새로운 에피소드 시작. 보드 제작자 = PC(${pc}). 지금까지의 전체 대화에서 확인된 ${pc}의 발화, 행동, 취향, 기억과 ${npc}와의 관계를 바탕으로 ${pc}가 혼자 실제로 메모하고 꾸며 온 개인 보드가 완성되어 있다고 가정하고, 그 완성본의 배치와 디자인을 상세하게 묘사해 주세요. ${npc}의 취향을 대신 반영하기보다 ${pc}의 시점과 선택이 드러나게 해주세요. ${npc}와 관련된 요소 외에도 ${pc}가 개인적으로 남겨 둘 법한 일상적인 흔적을 자연스럽게 포함할 수 있습니다. ${guide}]`;
    }

    return `[OOC: 롤플레잉 중단. 새로운 에피소드 시작. 보드 제작자 = NPC(${npc}) + PC(${pc}), 공동 제작. 지금까지의 전체 대화, 캐릭터 설정, 세계관과 관계 변화를 바탕으로 두 사람이 함께 메모하고 꾸며 온 공동 보드가 완성되어 있다고 가정하고, 그 완성본의 배치와 디자인을 상세하게 묘사해 주세요. 어느 한 사람의 개인 보드처럼 만들지 말고 두 사람의 흔적이 모두 보여야 합니다. 누가 적거나 붙인 흔적인지 문장 속에서 자연스럽게 구분해 주세요. 서로의 메모 옆에 짧게 답글을 덧붙였거나, 같은 사진·기념물에 서로 다른 반응이 남아 있는 식의 상호작용도 자연스럽게 포함해 주세요. ${guide}]`;
  }

  async function copyText(text){
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(text);
      return;
    }
    const ta=document.createElement("textarea");
    ta.value=text;
    ta.style.position="fixed";
    ta.style.left="-9999px";
    ta.style.top="0";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    document.execCommand("copy");
    ta.remove();
  }

  function status(text,isError=false){
    const el=$id("oocCopyStatus");
    if(!el)return;
    el.textContent=text;
    el.style.color=isError?"#b85f6f":"#a06d80";
  }

  function init(){
    document.querySelectorAll(".ooc-copy-btn").forEach(btn=>{
      btn.addEventListener("click",async()=>{
        const mode=btn.dataset.oocMode;
        const text=buildOoc(mode);
        try{
          await copyText(text);
          document.querySelectorAll(".ooc-copy-btn").forEach(x=>x.classList.remove("is-copied"));
          btn.classList.add("is-copied");
          const label=mode==="npc"?"NPC 보드":mode==="pc"?"PC 보드":"함께 꾸민 보드";
          status(`${label} OOC를 복사했어요 ✓`);
          setTimeout(()=>btn.classList.remove("is-copied"),1200);
        }catch(e){
          status("복사에 실패했어요. 브라우저의 클립보드 권한을 확인해 주세요.",true);
        }
      });
    });
  }

  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init);
  else init();
})();
</script>
