<script>
const $=s=>document.querySelector(s),board=$('#board'),rot=$('#rot'),opacity=$('#opacity');let selected=null,z=10,history=[],future=[],restoring=false;

function wireAll(){document.querySelectorAll('.item').forEach(wire)}
function files(input,type){input.onchange=()=>{[...input.files].forEach(f=>{let r=new FileReader;r.onload=()=>{let d=document.createElement('div'),im=document.createElement('img');im.src=r.result;d.appendChild(im);if(type==='photo'){let fr=$('#photoFrame').value;if(fr!=='basic')d.classList.add(fr)}makeItem(d,type)};r.readAsDataURL(f)});input.value=''}}files($('#photoInput'),'photo');files($('#stickerInput'),'sticker');
$('#photoBtn').onclick=()=>$('#photoInput').click();$('#stickerBtn').onclick=()=>$('#stickerInput').click();$('#textBtn').onclick=()=>{if(!$('#text').value.trim())return;let d=document.createElement('div');d.textContent=$('#text').value;let st=$('#textStyle').value;if(st!=='plain')d.classList.add(st);d.style.fontFamily=$('#font').value;d.style.color=$('#textColor').value;d.style.fontSize=$('#fontSize').value+'px';makeItem(d,'textitem');$('#text').value=''};

document.querySelectorAll('[data-svg]').forEach(b=>b.onclick=()=>{let d=document.createElement('div');d.className='decor-svg';d.innerHTML=svgDecor[b.dataset.svg];makeItem(d,'decor')});

$('#theme').onchange=()=>{board.className='board theme-'+$('#theme').value;snap()};$('#bg').oninput=()=>board.style.backgroundColor=$('#bg').value;
const BOARD_SIZES={
  '1:1':[900,900],
  '4:5':[800,1000],
  '3:4':[750,1000],
  '16:9':[1120,630]
};
function changeBoardRatio(key){
  const size=BOARD_SIZES[key];
  if(!size) return;
  const [w,h]=size;
  board.style.width=w+'px';
  board.style.height=h+'px';
  board.style.aspectRatio='auto';
  board.dataset.exportWidth=String(w);
  board.dataset.exportHeight=String(h);
  document.querySelectorAll('[data-size]').forEach(btn=>{
    btn.classList.toggle('active',btn.dataset.size===key);
  });
}
document.querySelectorAll('[data-size]').forEach(btn=>{
  btn.addEventListener('click',()=>changeBoardRatio(btn.dataset.size));

changeBoardRatio('1:1');
$('#wallBtn').onclick=()=>$('#wallInput').click();$('#wallInput').onchange=()=>{let f=$('#wallInput').files[0];if(!f)return;let r=new FileReader;r.onload=()=>{board.style.backgroundImage=`url(${r.result})`;board.style.backgroundSize='cover';board.style.backgroundPosition='center';snap()};r.readAsDataURL(f)};$('#wallClear').onclick=()=>{board.style.backgroundImage='';snap()};
function apply(){if(!selected)return;selected.dataset.rot=rot.value;selected.dataset.opacity=opacity.value/100;transform(selected)}rot.oninput=apply;opacity.oninput=apply;rot.onchange=snap;opacity.onchange=snap;
$('#front').onclick=()=>{if(selected){selected.style.zIndex=++z;snap()}};$('#back').onclick=()=>{if(selected){selected.style.zIndex=1;snap()}};$('#del').onclick=()=>{if(selected){selected.remove();selected=null;snap()}};$('#flip').onclick=()=>{if(selected){selected.dataset.flip=selected.dataset.flip==='1'?'0':'1';transform(selected);snap()}};$('#dup').onclick=()=>{if(!selected)return;let c=selected.cloneNode(true);c.classList.remove('selected');c.style.left=selected.offsetLeft+25+'px';c.style.top=selected.offsetTop+25+'px';board.appendChild(c);wire(c);select(c);snap()};
$('#undo').onclick=()=>{if(history.length<=1)return;future.push(history.pop());restore(history[history.length-1])};$('#redo').onclick=()=>{if(!future.length)return;let h=future.pop();history.push(h);restore(h)};$('#clear').onclick=()=>{if(confirm('보드의 모든 요소를 비우시겠습니까?')){board.querySelectorAll('.item').forEach(x=>x.remove());select(null);snap()}};
$('#save').onclick=async()=>{select(null);board.classList.add('hidden-export');try{let c=await html2canvas(board,{scale:3,useCORS:true,allowTaint:false,backgroundColor:null,logging:false});let a=document.createElement('a');a.download='DEARLY_BOARD.png';a.href=c.toDataURL('image/png');a.click()}catch(e){alert('PNG 저장 중 문제가 발생했습니다.')}finally{board.classList.remove('hidden-export')}};

er": "ribbon", "pearl": "star", "ticket": "frame"}, "matcha": {"ribbon": "leaf", "tape": "teacup", "clip": "gingham", "heart": "flower", "star": "label", "flower": "ribbon", "pearl": "cookie", "ticket": "stamp"}, "cherry": {"ribbon": "cherries", "tape": "ginghambow", "clip": "heart", "heart": "cake", "star": "flower", "flower": "label", "pearl": "ribbon", "ticket": "sparkle"}, "lilac": {"ribbon": "lavender", "tape": "butterfly", "clip": "bow", "heart": "perfume", "star": "flower", "flower": "lace", "pearl": "moon", "ticket": "frame"}, "metal": {"ribbon": "chain", "tape": "safety_pin", "clip": "chromeheart", "heart": "starbolt", "star": "tag", "flower": "clip", "pearl": "ring", "ticket": "barcode"}};
const TD_NAMES=["ribbon","tape","clip","heart","star","flower","pearl","ticket"];
const TD_LABEL={ribbon:"리본",tape:"테이프",clip:"클립",heart:"하트",star:"별",flower:"꽃",pearl:"펄",ticket:"티켓"};
function decorTheme(){
  const sel=document.getElementById("theme");
  const t=sel ? String(sel.value).trim() : "";
  if(t && EMBEDDED_DECOR["assets/decor/"+t+"/ribbon.png"]) return t;
  return Object.keys(EMBEDDED_DECOR)[0].split("/")[2];
}
function addThemeDecor(t,n){
  const src=EMBEDDED_DECOR["assets/decor/"+t+"/"+n+".png"];
  if(!src)return;
  const box=document.createElement("div"),img=document.createElement("img");
  img.src=src; img.alt=TD_LABEL[n]||n; box.appendChild(img);
  makeItem(box,"theme-png-decor");
}
function renderThemeDecor(){
  const g=document.getElementById("themeDecorGallery");
  if(!g)return;
  const t=decorTheme(); g.innerHTML="";
  TD_NAMES.forEach(n=>{
    const src=EMBEDDED_DECOR["assets/decor/"+t+"/"+n+".png"];
    if(!src)return;
    const b=document.createElement("button"); b.type="button"; b.className="decor-thumb"; b.title=(THEME_DECOR_LABELS[t]&&THEME_DECOR_LABELS[t][n])||TD_LABEL[n];
    const img=document.createElement("img"); img.src=src; img.alt=(THEME_DECOR_LABELS[t]&&THEME_DECOR_LABELS[t][n])||TD_LABEL[n];
    b.appendChild(img); b.addEventListener("click",()=>addThemeDecor(t,n)); g.appendChild(b);
  });
}
function initThemeDecor(){
  const sel=document.getElementById("theme");
  if(sel)sel.addEventListener("change",()=>setTimeout(renderThemeDecor,0));
  renderThemeDecor();
}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",initThemeDecor);
else initThemeDecor();
