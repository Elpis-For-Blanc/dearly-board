<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DEARLY BOARD V1</title><script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f1f3;color:#393238}.app{display:grid;grid-template-columns:320px 1fr;min-height:100vh}.panel{padding:22px;background:#fff;border-right:1px solid #ddd}.brand{font:25px Georgia,serif;letter-spacing:3px}.sub{font-size:12px;color:#888;margin:5px 0 20px}.g{border-top:1px solid #eee;padding:15px 0}.g h3{font-size:12px}.row{display:flex;gap:7px;flex-wrap:wrap}button,select,textarea{font:inherit}button{border:1px solid #d8cdd2;background:#fff;padding:9px 11px;border-radius:8px}.field{width:100%;padding:9px;border:1px solid #ddd;border-radius:7px;margin:5px 0}.workspace{padding:28px;display:flex;justify-content:center;overflow:auto}.board{width:900px;height:900px;position:relative;overflow:hidden;background:#fff8fb;border:10px solid #f2b7ca;box-shadow:0 8px 30px #0002}.item{position:absolute;left:80px;top:80px;touch-action:none;user-select:none}.item.selected{outline:2px dashed #777;outline-offset:4px}.item img{display:block;width:100%;height:100%;object-fit:contain;pointer-events:none}.photo{width:220px;height:220px;background:#fff;padding:10px;box-shadow:0 4px 14px #0002}.sticker{width:130px;height:130px}.textitem{width:260px;padding:12px;background:#ffffffcc;white-space:pre-wrap;line-height:1.55}.handle{display:none;position:absolute;width:14px;height:14px;right:-8px;bottom:-8px;background:#fff;border:1px solid #555;border-radius:50%}.selected .handle{display:block}.cork{background:#c99561;border-color:#9d7048}.minimal{background:#f7f7f7;border-color:#222}.dark{background:#18171a;border-color:#444}.y2k{background:linear-gradient(135deg,#e9f6ff,#f7e9ff,#fff);border-color:#ccc}.vintage{background:#e9dfc8;border-color:#7f6952}@media(max-width:800px){.app{grid-template-columns:1fr}.workspace{padding:10px}.board{transform:scale(.7);transform-origin:top center;margin-bottom:-260px}}</style></head><body><div class="app"><aside class="panel"><div class="brand">DEARLY BOARD</div><div class="sub">좋아하는 것들로 채우는 우리만의 보드.</div><div class="g"><h3>BOARD</h3><select id="theme" class="field"><option value="">PRINCESS PINK</option><option value="cork">CORK</option><option value="minimal">MINIMAL</option><option value="dark">DARK</option><option value="y2k">Y2K</option><option value="vintage">VINTAGE</option></select><div class="row"><button onclick="size(900,900)">1:1</button><button onclick="size(800,1000)">4:5</button><button onclick="size(1100,619)">16:9</button></div></div><div class="g"><h3>ADD</h3><div class="row"><button id="photoBtn">사진 +</button><button id="stickerBtn">PNG 스티커 +</button><button id="textBtn">텍스트 +</button></div><input id="photo" type="file" accept="image/*" hidden><input id="sticker" type="file" accept="image/png,image/webp" hidden><textarea id="txt" class="field" rows="4" placeholder="문구를 입력해 주세요."></textarea></div><div class="g"><h3>SELECTED</h3><div class="row"><button id="front">앞으로</button><button id="back">뒤로</button><button id="dup">복제</button><button id="flip">좌우반전</button><button id="del">삭제</button></div><label>회전 <input id="rot" class="field" type="range" min="-180" max="180" value="0"></label><label>투명도 <input id="op" class="field" type="range" min="10" max="100" value="100"></label></div><div class="g"><button id="save">고화질 PNG 저장</button></div></aside><main class="workspace"><div id="board" class="board"></div></main></div><script>const board=document.querySelector('#board');let sel=null,z=10;function select(e){document.querySelectorAll('.item').forEach(x=>x.classList.remove('selected'));sel=e;if(e){e.classList.add('selected');rot.value=e.dataset.r||0;op.value=(e.dataset.o||1)*100}}function item(e,c){e.classList.add('item',c);e.style.zIndex=++z;e.dataset.r=0;e.dataset.o=1;let h=document.createElement('i');h.className='handle';e.append(h);board.append(e);drag(e);resize(e,h);select(e)}function drag(e){e.onpointerdown=a=>{if(a.target.className==='handle')return;select(e);let x=a.clientX,y=a.clientY,l=e.offsetLeft,t=e.offsetTop;e.setPointerCapture(a.pointerId);e.onpointermove=b=>{e.style.left=l+b.clientX-x+'px';e.style.top=t+b.clientY-y+'px'};e.onpointerup=()=>{e.onpointermove=null;e.onpointerup=null}}}function resize(e,h){h.onpointerdown=a=>{a.stopPropagation();let x=a.clientX,y=a.clientY,w=e.offsetWidth,hh=e.offsetHeight;h.setPointerCapture(a.pointerId);h.onpointermove=b=>{e.style.width=Math.max(50,w+b.clientX-x)+'px';e.style.height=Math.max(40,hh+b.clientY-y)+'px'};h.onpointerup=()=>{h.onpointermove=null;h.onpointerup=null}}}function loader(inp,c){inp.onchange=()=>{let f=inp.files[0];if(!f)return,r=new FileReader;r.onload=()=>{let d=document.createElement('div'),im=document.createElement('img');im.src=r.result;d.append(im);item(d,c)};r.readAsDataURL(f);inp.value=''}}loader(photo,'photo');loader(sticker,'sticker');photoBtn.onclick=()=>photo.click();stickerBtn.onclick=()=>sticker.click();textBtn.onclick=()=>{if(!txt.value.trim())return;let d=document.createElement('div');d.textContent=txt.value;item(d,'textitem');txt.value=''};theme.onchange=()=>board.className='board '+theme.value;function size(w,h){board.style.width=w+'px';board.style.height=h+'px'}function tr(){if(!sel)return;sel.dataset.r=rot.value;sel.dataset.o=op.value/100;sel.style.opacity=op.value/100;sel.style.transform=`rotate(${rot.value}deg) scaleX(${sel.dataset.f==='1'?-1:1})`}rot.oninput=op.oninput=tr;front.onclick=()=>{if(sel)sel.style.zIndex=++z};back.onclick=()=>{if(sel)sel.style.zIndex=1};del.onclick=()=>{if(sel){sel.remove();sel=null}};flip.onclick=()=>{if(sel){sel.dataset.f=sel.dataset.f==='1'?'0':'1';tr()}};dup.onclick=()=>{if(!sel)return;let c=sel.cloneNode(true);c.classList.remove('selected');c.style.left=sel.offsetLeft+25+'px';c.style.top=sel.offsetTop+25+'px';board.append(c);drag(c);resize(c,c.querySelector('.handle'));select(c)};board.onclick=e=>{if(e.target===board)select(null)};save.onclick=async()=>{select(null);try{let c=await html2canvas(board,{scale:3,useCORS:true,backgroundColor:null});let a=document.createElement('a');a.download='DEARLY_BOARD.png';a.href=c.toDataURL();a.click()}catch(e){alert('PNG 저장 중 문제가 발생했습니다.')}};</script></body></html>
